name: Changelog

on:
  push:
    branches:
      - 'release/v*'
      - 'hotfix/v*'

permissions:
  contents: write

jobs:
  changelog:
    name: Update CHANGELOG.md on release branch
    runs-on: ubuntu-latest
    # Defense-in-depth against a self-trigger loop. Pushes made by the default
    # GITHUB_TOKEN (the commit step below) do NOT trigger workflows, so this
    # only guards a manual re-push of the bot's own changelog commit.
    if: >-
      github.event.head_commit.message != 'chore: update changelog'
    steps:
      - name: Checkout release branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Derive the release version from the branch name. The real git tag does
      # not exist yet (tag-release.yml creates it AFTER the merge to main), so
      # git-cliff is told the version explicitly via --tag below. Untrusted
      # event data (the branch name) is routed through env and validated against
      # a strict semver regex, so the value passed to --tag has no shell/arg
      # injection surface.
      - name: Derive release version from branch name
        id: ver
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${BRANCH#release/}"
          VERSION="${VERSION#hotfix/}"
          VERSION="${VERSION#v}"
          # bash =~ anchors against the whole string (no REG_NEWLINE), so an
          # embedded newline is rejected too — unlike line-oriented `grep`.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Could not derive a semver tag from branch '$BRANCH' (parsed '$VERSION'). Use release/vX.Y.Z or hotfix/vX.Y.Z."
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      # git-cliff enriches commits via the GitHub API (cliff.toml has
      # [remote.github]); the org's default GITHUB_TOKEN is not authorized for
      # those API reads, so git-cliff panics ("Could not get github metadata").
      # Every other git-cliff invocation (release.yml) uses the SJ App token
      # for exactly this reason. Mint it here too.
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # ratchet:actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.SJ_APP_ID }}
          private-key: ${{ secrets.SJ_APP_PRIVATE_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # ratchet:orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # --tag labels the unreleased commits as this version. steps.ver.tag
          # is semver-validated above, so it is safe to interpolate here.
          args: --tag ${{ steps.ver.outputs.tag }} --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          # App token (not the default GITHUB_TOKEN) so git-cliff's GitHub API
          # enrichment authenticates. The commit/push below deliberately stays on
          # the checkout's default GITHUB_TOKEN credential — a default-token push
          # does not re-trigger workflows, avoiding a self-trigger loop.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Commit CHANGELOG.md if changed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            echo "::notice::CHANGELOG.md unchanged; nothing to commit."
            exit 0
          fi
          git add CHANGELOG.md
          git commit -m "chore: update changelog"
          # Push back to the release branch with GITHUB_TOKEN. Release branches
          # are not protected by rulesets (only main/develop are), and a
          # GITHUB_TOKEN push does not retrigger this workflow.
          git push origin "HEAD:${BRANCH}"
