version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - dupl
    - errorlint
    - gocognit
    - gocritic
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    gocognit:
      min-complexity: 50
    gosec:
      excludes:
        - G306
    staticcheck:
      checks:
        - -S1028
        - all
        - -QF1002
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      - linters:
          - dupl
        path: _test\.go$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
